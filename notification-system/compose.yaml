# Local development only. The Go services are configured by api/.env and worker/.env,
# whose credentials are placeholders, not secrets.
#
# There is no autoscaling here: each provider gets one worker. The Kubernetes manifests
# in deploy/k8s scale the same images with KEDA; deploy/cluster-up.sh runs them.

# Spelled out, although it is the name of this directory, because Alloy picks the
# containers whose logs it follows by it. See deploy/alloy/config.alloy.
name: notification-system

# Both images are built from this directory, because they share the commons module.
x-api-image: &api-image
  context: .
  dockerfile: api/Dockerfile

x-worker-image: &worker-image
  context: .
  dockerfile: worker/Dockerfile

# What every Go service needs to reach the broker, and to come back if it loses it:
# consumers exit when their connection drops.
x-broker: &broker
  restart: on-failure
  depends_on: &broker-ready
    rabbitmq:
      condition: service_healthy

# One worker image runs as four pools, one per provider. They differ only in PROVIDER.
x-worker: &worker
  <<: *broker
  build: *worker-image
  env_file: ./worker/.env
  depends_on:
    <<: *broker-ready
    mockprovider:
      condition: service_started

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: audience
      POSTGRES_PASSWORD: audience
      POSTGRES_DB: audience
    ports:
      - "5432:5432"
    volumes:
      # Loaded once, when the database is first created.
      - ./api/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audience -d audience"]
      interval: 2s
      timeout: 2s
      retries: 15

  rabbitmq:
    # Pinned: how strictly high-priority messages overtake normal ones in a quorum
    # queue differs between RabbitMQ versions. See the README.
    image: rabbitmq:4.3-management
    hostname: rabbitmq # the node's data directory is named after it
    environment:
      RABBITMQ_DEFAULT_USER: notify
      RABBITMQ_DEFAULT_PASS: notify
    ports:
      - "5672:5672"
      - "15672:15672" # management UI and API
      - "15692:15692" # metrics, from the rabbitmq_prometheus plugin the image enables
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Collects the metrics of the api, the workers and RabbitMQ: the state of each app on
  # each provider. See deploy/prometheus/prometheus.yml.
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  # The four below are how an operator watches the system: Grafana shows the metrics of
  # Prometheus, the traces of Tempo and the logs of Loki. None of them keeps anything
  # across a restart. See the README, under Monitoring.

  # Dashboards, traces and logs, on localhost:3001. Everything it shows is set up from
  # deploy/grafana; what is changed in the browser is not kept. Anyone may look and
  # explore without signing in, and admin / admin is a placeholder like the other
  # credentials here.
  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      # Editor rather than Viewer: only an editor may open Explore, where traces are read.
      GF_AUTH_ANONYMOUS_ORG_ROLE: Editor
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/delivery-pipeline.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000" # 3000 is the console
    depends_on:
      - prometheus
      - tempo
      - loki

  # Takes the traces the api and the workers export to tempo:4318.
  tempo:
    image: grafana/tempo:3.1.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro

  # Takes the log lines Alloy pushes.
  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./deploy/loki/loki.yaml:/etc/loki/loki.yaml:ro

  # Follows the output of every container here and pushes it to Loki.
  alloy:
    image: grafana/alloy:v1.20.1
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # How it finds the containers and reads their output. The socket tells about every
      # container on the machine, not only these: fine on a development machine, and the
      # reason the cluster does it another way (deploy/k8s/infra/alloy.yaml).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  api:
    <<: *broker
    build: *api-image
    env_file: ./api/.env
    ports:
      - "8080:8080"
    depends_on:
      <<: *broker-ready
      db:
        condition: service_healthy

  # The console: the React app, and /v1 passed on to the api. See web/nginx.conf.template.
  web:
    build: ./web
    ports:
      - "3000:80"
    depends_on:
      - api

  # Stands in for Twilio, Mailchimp, APNs and FCM. Set ERROR_RATE or THROTTLE_RATE
  # (0 to 1) in the shell that runs compose to make it answer 500 or 429 that often;
  # that overrides worker/.env.
  mockprovider:
    build: *worker-image
    entrypoint: ["/mockprovider"]
    env_file: ./worker/.env
    environment:
      ERROR_RATE: ${ERROR_RATE:-0}
      THROTTLE_RATE: ${THROTTLE_RATE:-0}
    ports:
      - "8081:8081"

  worker-twilio:
    <<: *worker
    environment:
      PROVIDER: twilio

  worker-mailchimp:
    <<: *worker
    environment:
      PROVIDER: mailchimp

  worker-apns:
    <<: *worker
    environment:
      PROVIDER: apns

  worker-fcm:
    <<: *worker
    environment:
      PROVIDER: fcm
