# The Loki of compose.yaml and of deploy/k8s/infra: one process that takes the log lines
# Alloy pushes and answers Grafana's questions about them.
#
# Logs are stored in the container's own filesystem, so a restart forgets them, and
# nothing here sets how long they are kept: they are for looking at, not for keeping.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

analytics:
  reporting_enabled: false
