# The five things worth reaching from outside the node. cluster-up.sh publishes these
# node ports on the host, on ports other than the ones compose uses:
#
#   API                  30080 -> localhost:18080
#   console              30000 -> localhost:13000
#   RabbitMQ management  31672 -> localhost:25672
#   Prometheus           30090 -> localhost:19090
#   Grafana              30030 -> localhost:13001
apiVersion: v1
kind: Service
metadata:
  name: api-external
spec:
  type: NodePort
  selector: {app: api}
  ports:
    - {name: http, port: 8080, targetPort: http, nodePort: 30080}
---
apiVersion: v1
kind: Service
metadata:
  name: web-external
spec:
  type: NodePort
  selector: {app: web}
  ports:
    - {name: http, port: 80, targetPort: http, nodePort: 30000}
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-external
spec:
  type: NodePort
  selector: {app: rabbitmq}
  ports:
    - {name: management, port: 15672, targetPort: management, nodePort: 31672}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-external
spec:
  type: NodePort
  selector: {app: prometheus}
  ports:
    - {name: http, port: 9090, targetPort: http, nodePort: 30090}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-external
spec:
  type: NodePort
  selector: {app: grafana}
  ports:
    - {name: http, port: 3000, targetPort: http, nodePort: 30030}
