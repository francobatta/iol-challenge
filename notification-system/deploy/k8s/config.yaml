# The namespace everything runs in.
#
# The configuration of the services is not here: it is the .env file of each module,
# turned into a ConfigMap. Postgres and RabbitMQ are assumed to exist already; the files
# say where.
#
#   kubectl -n notifications create configmap api-config    --from-env-file=api/.env
#   kubectl -n notifications create configmap worker-config --from-env-file=worker/.env
apiVersion: v1
kind: Namespace
metadata:
  name: notifications
