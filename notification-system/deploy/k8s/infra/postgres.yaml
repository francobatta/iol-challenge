# One Postgres, reached as db:5432. Its data is on a volume from the default storage
# class of the cluster.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  labels: {app: db}
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
        - name: postgres
          image: postgres:18
          ports:
            - {name: postgres, containerPort: 5432}
          envFrom:
            - secretRef: {name: postgres}
          volumeMounts:
            # Since Postgres 18 the image keeps its data under a directory named after
            # the version, so the volume goes one level up.
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: schema, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
          # While the image initializes a new database it listens on a socket only, so
          # asking over TCP is what tells "ready" from "still loading the schema".
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 60
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: schema
          configMap: {name: db-schema}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector: {app: db}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
