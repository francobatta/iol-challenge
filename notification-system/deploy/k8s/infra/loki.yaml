# One Loki, reached as loki:3100 and configured by ../../loki/loki.yaml. Alloy pushes the
# logs of the pods to it and Grafana queries it. Its data is not kept across restarts:
# the logs are for looking at, not for keeping.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels: {app: loki}
spec:
  replicas: 1
  selector:
    matchLabels: {app: loki}
  template:
    metadata:
      labels: {app: loki}
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.7.8
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - {name: http, containerPort: 3100}
          volumeMounts:
            - {name: config, mountPath: /etc/loki, readOnly: true}
            - {name: data, mountPath: /loki}
          # It calls itself ready some 15 seconds after it starts, by design.
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: config
          configMap: {name: loki-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  selector: {app: loki}
  ports:
    - {name: http, port: 3100, targetPort: http}
