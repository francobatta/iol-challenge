# The mailchimp worker pool: ../pool with the provider's name filled in. The four pools differ
# in nothing else; change ../pool to change them all.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../pool

nameSuffix: -mailchimp

labels:
  - pairs: {provider: mailchimp}
    includeSelectors: true
    includeTemplates: true

patches:
  - target: {kind: Deployment, name: worker}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/env/0/value, value: mailchimp}
  - target: {kind: ScaledObject, name: worker}
    patch: |-
      - {op: replace, path: /spec/scaleTargetRef/name, value: worker-mailchimp}
      - {op: replace, path: /spec/triggers/0/metadata/queueName, value: '^notify\.send\.mailchimp\..+'}
      - {op: replace, path: /spec/triggers/1/metadata/queueName, value: '^notify\.send\.mailchimp\..+'}
