# One worker pool per provider, all from the image built by ../../worker/Dockerfile. They differ
# only in PROVIDER; the rest of their configuration is the worker-config ConfigMap, made
# from ../../worker/.env. Replica counts are owned by the ScaledObjects in keda.yaml,
# which is why the Deployments set none.
#
# This file is written out in full rather than templated so that it can be applied as
# it is; keep the four Deployments identical apart from the provider name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-twilio
  namespace: notifications
  labels: {app: worker, provider: twilio}
spec:
  selector:
    matchLabels: {app: worker, provider: twilio}
  template:
    metadata:
      labels: {app: worker, provider: twilio}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      # On SIGTERM a worker stops taking deliveries and finishes the ones it is
      # sending. A provider gets 3s to answer and the outcome 10s to be published,
      # so 30s is ample.
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: notification-system/worker:latest # replace with the pushed image
          ports:
            - {name: metrics, containerPort: 9090}
          env:
            - {name: PROVIDER, value: twilio}
          envFrom:
            - configMapRef: {name: worker-config}
          # The process exits when it loses RabbitMQ and is restarted by the kubelet,
          # so the probe only has to catch a process that is up but stuck.
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 10
          # Sending is waiting on the network: a pod at full concurrency uses a
          # fraction of a core.
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {memory: 256Mi}
---
